name: editor
on: [push, pull_request]
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and analyze
        run: dotnet build KinokoTAS.slnx -c Release -bl:artifacts/logs/build.binlog
      - name: Headless editor and recording checks
        run: dotnet run --project tests/KinokoTAS.Checks -c Release --no-build -- artifacts/ci
      - name: Publish Windows x64 NativeAOT
        run: dotnet publish src/KinokoTAS.App -c Release -r win-x64 -p:PublishProfile=NativeAot -o artifacts/windows-x64-aot -bl:artifacts/logs/publish-aot.binlog
      - uses: actions/upload-artifact@v4
        with:
          name: 6kinoko-tas-windows-x64-aot
          path: |
            artifacts/windows-x64-aot/*.exe
            artifacts/windows-x64-aot/*.dll
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editor-checks
          path: |
            artifacts/ci
            artifacts/logs
